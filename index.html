<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>True Match Coatings</title>
<meta name="description" content="Custom paint and coatings color matching for Colorado businesses and homeowners.">
<style>
  :root {
    --graphite: #1c1e22;
    --graphite-deep: #121316;
    --paper: #eceae4;
    --paper-dim: #9a9a94;
    --line: #34373d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--graphite-deep);
    color: var(--paper);
    font-family: -apple-system, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 6vh 24px;
  }

  .swatches {
    display: flex;
    gap: 6px;
    margin-bottom: 48px;
  }

  .swatch {
    width: 34px;
    height: 34px;
    border-radius: 3px;
  }

  .swatch:nth-child(1) { background: #b5432c; }
  .swatch:nth-child(2) { background: #c9862f; }
  .swatch:nth-child(3) { background: #4f7a5b; }
  .swatch:nth-child(4) { background: #3c6e8f; }
  .swatch:nth-child(5) { background: #5b4c8a; }
  .swatch:nth-child(6) { background: #8a3c5e; }

  main {
    text-align: center;
    max-width: 620px;
  }

  h1 {
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
    line-height: 1.05;
  }

  p.lede {
    font-size: 1.15rem;
    line-height: 1.6;
    color: var(--paper-dim);
    margin: 0 0 40px;
    max-width: 48ch;
    margin-left: auto;
    margin-right: auto;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 0.95rem;
    color: var(--paper-dim);
  }

  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c9862f;
  }

  footer {
    margin-top: 64px;
    font-size: 0.9rem;
    color: var(--paper-dim);
  }

  footer a {
    color: var(--paper);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }

  footer a:hover {
    border-bottom-color: var(--paper);
  }

  @media (prefers-reduced-motion: no-preference) {
    .swatches { animation: rise 0.6s ease-out; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>
  <div class="swatches" aria-hidden="true">
    <div class="swatch"></div>
    <div class="swatch"></div>
    <div class="swatch"></div>
    <div class="swatch"></div>
    <div class="swatch"></div>
    <div class="swatch"></div>
  </div>

  <main>
    <h1>True Match Coatings</h1>
    <p class="lede">
      Custom color matching for paint, powder coat, and finish work &mdash;
      beyond what a color computer can do on its own. Serving Colorado
      businesses and homeowners.
    </p>
    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      Site under construction &mdash; check back soon
    </div>
  </main>

  <footer>
    <a href="mailto:info@truematchcoatings.com">info@truematchcoatings.com</a>
  </footer>
</body>
</html>
